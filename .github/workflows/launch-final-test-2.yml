name: Lancer le test final corrigé Git et VS Code

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/launch-final-test-2.yml"

permissions:
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Réactiver Step 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          step0="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml" --jq '.state')"
          if [ "$step0" != "active" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml/enable"
          fi
