name: Lancer le test final Git et VS Code

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/launch-final-test.yml"

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Réactiver Step 0 et mettre les autres étapes en attente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for workflow in             1-clone-and-branch.yml             2-working-tree-staging-commit.yml             3-history-restore-vscode.yml             4-remotes-and-pull-request.yml             5-review-merge.yml; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$workflow" --jq '.state' 2>/dev/null || true)"
            if [ "$state" = "active" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/$workflow/disable"
            fi
          done

          step0="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml" --jq '.state' 2>/dev/null || true)"
          if [ "$step0" != "active" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml/enable"
          fi
