name: Préparer le test V1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prepare-v1-audit.yml"

permissions:
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Désactiver Step 0 avant synchronisation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml" --jq '.state' 2>/dev/null || true)"
          if [ "$state" = "active" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml/disable"
          fi
